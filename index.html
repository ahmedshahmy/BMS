<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>British Muslim Society &middot; Newsletter</title>
<meta name="description" content="The newsletter of the British Muslim Society: news, prayer timetables, events and updates from our community.">
<meta name="theme-color" content="#01237d">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-title" content="BMS Newsletter">
<meta property="og:title" content="British Muslim Society &middot; Newsletter">
<meta property="og:description" content="News, prayer timetables, events and updates from the British Muslim Society.">
<meta property="og:type" content="website">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header" id="siteHeader">
  <div class="shell header-inner">
    <a class="brand" href="#/" aria-label="British Muslim Society newsletter home">
      <img class="brand-logo" src="logo.png" alt="British Muslim Society logo" width="56" height="56" decoding="async">
      <span class="brand-text">
        <span class="brand-name">British Muslim Society</span>
        <span class="brand-sub">Newsletter</span>
      </span>
    </a>
    <nav class="header-nav" aria-label="Main">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/archive" data-nav="archive">Issues</a>
    </nav>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<footer class="site-footer">
  <div class="shell">
    <img class="footer-logo" src="logo.png" alt="" width="44" height="44" loading="lazy" decoding="async">
    <p class="footer-name">British Muslim Society</p>
    <p class="footer-note">
      Newsletter published by the BMS communications team.
      Corrections, articles and photographs are always welcome &mdash;
      email <a href="mailto:newsletter@britishmuslimsociety.org.uk">newsletter@britishmuslimsociety.org.uk</a>.
    </p>
    <p class="footer-meta">&copy; <span id="year"></span> British Muslim Society</p>
  </div>
</footer>

<noscript>
  <div class="shell noscript">
    <h1>JavaScript is required</h1>
    <p>
      This newsletter is built from the files in the <code>issues/</code> folder
      and needs JavaScript to display them. Every issue is also readable as
      plain text: open <code>issues/&lt;issue&gt;/&lt;tile&gt;/text.md</code>.
    </p>
  </div>
</noscript>

<script src="issues/index.js"></script>
<script src="js/app.js"></script>
</body>
</html>
